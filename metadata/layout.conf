masters = gentoo guru
thin-manifests = true
sign-manifests = false

# Allow specific PROPERTIES and RESTRICT values in ebuilds. network-sandbox
# is supported by portage (restricts the network sandbox for the package so
# e.g. src_unpack can fetch time-signed URLs) but not yet in the gentoo repo
# restrict-allowed list.
properties-allowed = interactive live test_network test_privileged
restrict-allowed = binchecks bindist fetch installsources mirror network-sandbox preserve-libs splitdebug strip test userpriv
