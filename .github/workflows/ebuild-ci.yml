name: Ebuild CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.ebuild'
      - '**/files/**'
      - '**/Manifest'
      - '**/metadata.xml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.ebuild'
      - '**/files/**'
      - '**/Manifest'
      - '**/metadata.xml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        init: [openrc, systemd]

    container:
      image: ${{ matrix.init == 'systemd' && 'gentoo/stage3:systemd' || 'gentoo/stage3:latest' }}
      options: --tmpfs /run --tmpfs /tmp

    steps:
      - name: Setup profile (${{ matrix.init }})
        run: |
          echo "Current profile:"
          eselect profile show || true
          echo ""
          echo "Available profiles:"
          eselect profile list 2>/dev/null | grep 'default/linux/amd64' | head -10 || true

      - name: Sync portage tree
        run: |
          emerge-webrsync 2>&1 | tail -5 || emerge --sync --quiet 2>&1 | tail -5

      - name: Install required tools
        run: |
          emerge -1 --quiet app-arch/unzip 2>&1 || echo "unzip: emerge failed"
          # ar (binutils) needed for unpacker eclass (.deb extraction)
          command -v ar >/dev/null 2>&1 || emerge -1 --quiet sys-devel/binutils 2>&1 || true
          # git is no longer shipped in stage3 images (removed upstream
          # 2026-08); required by the guru clone and changed-ebuild detection
          command -v git >/dev/null 2>&1 || emerge -1 --quiet dev-vcs/git
          echo ""
          echo "=== Tool check ==="
          for tool in unzip tar gzip xz ar git; do
            command -v $tool >/dev/null 2>&1 && echo "$tool: OK" || echo "$tool: MISSING"
          done

      # Checked out only after git is installed. Without git, actions/checkout
      # falls back to a tarball with no .git directory, so the changed-ebuild
      # detection below cannot run.
      - uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 0

      - name: Register overlay
        run: |
          REPO_DIR="${GITHUB_WORKSPACE}/repo"
          mkdir -p /etc/portage/repos.conf
          # stage3 images no longer ship a repos.conf entry for gentoo.
          # portage falls back to PORTDIR silently, but pkgcore-based
          # tools (pkgcheck) error out without an explicit definition.
          cat > /etc/portage/repos.conf/gentoo.conf << EOF
          [gentoo]
          location = /var/db/repos/gentoo
          sync-type = webrsync
          auto-sync = no
          EOF
          cat > /etc/portage/repos.conf/ruizhi-overlay.conf << EOF
          [ruizhi-overlay]
          location = ${REPO_DIR}
          priority = 50
          auto-sync = no
          EOF

      - name: Register guru overlay (required by masters)
        run: |
          git clone --depth=1 https://github.com/gentoo-mirror/guru.git /var/db/repos/guru
          cat > /etc/portage/repos.conf/guru.conf << EOF
          [guru]
          location = /var/db/repos/guru
          auto-sync = no
          EOF

      - name: Find changed ebuilds
        id: changed
        run: |
          cd "${GITHUB_WORKSPACE}/repo" || { echo "::error::repository checkout is missing"; exit 1; }

          # An empty list skips the verify step, so a failing git command must
          # stop the job here instead of producing an empty result.
          command -v git >/dev/null 2>&1 || { echo "::error::git is required for changed-ebuild detection"; exit 1; }
          git rev-parse --git-dir >/dev/null 2>&1 || { echo "::error::the checkout is not a git repository"; exit 1; }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "::error::cannot fetch the base branch"; exit 1; }
            BASE="FETCH_HEAD"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: test prebuilt/binary ebuilds only.
            # Source ebuilds need build deps (go, cmake, qt) not in stage3.
            EBUILDS=$(
              for e in $(find . -name '*.ebuild' ! -name '*9999*' | sort); do
                dir=$(dirname "$e")
                pkg=$(basename "$dir")
                case "$pkg" in
                  goldendict-ng|latte-dock-ng|xrdp|xorgxrdp)
                    continue ;;
                  *) echo "$e" ;;
                esac
              done
            )
            echo "ebuilds<<EOF" >> $GITHUB_OUTPUT
            echo "${EBUILDS}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Testing binary ebuilds only: ${EBUILDS}"
            exit 0
          else
            # Compare with the previous tip of the branch, so every commit of
            # the push is checked. A new branch has an all-zero "before".
            BASE="${{ github.event.before }}"
            if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi

          git cat-file -e "${BASE}^{commit}" 2>/dev/null || { echo "::error::base commit ${BASE} is not in the checkout"; exit 1; }
          CHANGED=$(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD") || { echo "::error::git diff ${BASE}...HEAD failed"; exit 1; }

          EBUILDS=$(printf '%s\n' "${CHANGED}" | grep '\.ebuild$' || true)

          # If no ebuilds directly changed, find ebuilds in changed dirs
          if [ -z "${EBUILDS}" ]; then
            DIRS=$(printf '%s\n' "${CHANGED}" | sed -n 's#/[^/]*$##p' | sort -u)
            for d in ${DIRS}; do
              for e in "${d}/"*.ebuild; do
                [ -f "${e}" ] && EBUILDS="${EBUILDS} ${e}"
              done
            done
          fi

          EBUILDS=$(printf '%s\n' ${EBUILDS} | sed '/^$/d' | sort -u)
          {
            echo "ebuilds<<EOF"
            if [ -n "${EBUILDS}" ]; then printf '%s\n' "${EBUILDS}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed ebuilds (${BASE}...HEAD):"
          if [ -n "${EBUILDS}" ]; then printf '  %s\n' ${EBUILDS}; else echo "  (none)"; fi

      - name: Smoke test (pkgcheck scan)
        run: |
          echo "=== Smoke test: pkgcheck scan ==="
          if ! command -v pkgcheck &>/dev/null; then
            emerge -1 --quiet dev-util/pkgcheck 2>&1 || true
          fi
          if command -v pkgcheck &>/dev/null; then
            pkgcheck scan --repo=ruizhi-overlay
          else
            echo "pkgcheck unavailable, skipping scan"
          fi

      - name: Verify ebuilds (${{ matrix.init }})
        if: steps.changed.outputs.ebuilds != ''
        run: |
          export FEATURES="-sandbox -usersandbox -ipc-sandbox -network-sandbox -pid-sandbox"
          export PORTAGE_TMPDIR="${GITHUB_WORKSPACE}/tmp"
          export DISTDIR="${GITHUB_WORKSPACE}/distfiles"
          export PKGDIR="${GITHUB_WORKSPACE}/packages"
          mkdir -p "${PORTAGE_TMPDIR}" "${DISTDIR}" "${PKGDIR}"

          FAILED=""
          PASSED=""

          while IFS= read -r ebuild; do
            [ -z "${ebuild}" ] && continue
            ebuild="${GITHUB_WORKSPACE}/repo/${ebuild}"
            pkg=$(basename "$(dirname "${ebuild}")")

            echo ""
            echo "=== ${pkg} ==="

            if ebuild "${ebuild}" clean install; then
              echo "PASS: ${pkg}"
              PASSED="${PASSED} ${pkg}"
            else
              rc=$?
              echo "FAIL: ${pkg} (exit: ${rc})"
              FAILED="${FAILED} ${pkg}"
            fi
          done <<< "${{ steps.changed.outputs.ebuilds }}"

          echo ""
          echo "========================================"
          echo "Summary (${{ matrix.init }}):"
          echo "  Passed: $(echo ${PASSED} | wc -w)"
          echo "  Failed: $(echo ${FAILED} | wc -w)"
          if [ -n "${FAILED}" ]; then
            echo "  Failures:${FAILED}"
          fi
          echo "========================================"

          # On PR or push, fail if any ebuild failed
          if [ -n "${FAILED}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "CI: changed ebuilds must pass verification"
            exit 1
          fi
